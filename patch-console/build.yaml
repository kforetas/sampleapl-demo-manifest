# クラスタ内でビルドして内部レジストリに格納する
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: patch-demo-console
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: patch-demo-console
spec:
  source:
    type: Git
    git:
      uri: 'https://github.com/kforetas/patch-demo-console.git'
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: 'patch-demo-console:latest'
  triggers:
    - type: ConfigChange
